[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.1",
    "anthropic>=0.102.0",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.mypy]
disable_error_code = "empty-body" # This allows our dummy methods
