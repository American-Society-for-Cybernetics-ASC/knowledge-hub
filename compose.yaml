services:
  server:
    build: backend
    command: ["uv", "run", "--package", "server", "fastapi", "dev", "server/main.py", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - 8000:80
    links: # Allows the server to reach the database at host:port=db:5432
      - db
    networks:
      - public
      - isolated
  auth_server:
    build: backend
    command: ["uv", "run", "--package", "auth_server", "fastapi", "dev", "auth_server/main.py", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - 8001:80
    links: # Allows the server to reach the database at host:port=db:5432
      - db
    networks:
      - public
      - isolated
  db:
    image: postgres:latest
    shm_size: 128mb
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - isolated
networks:
  isolated:
    internal: true
  public:
volumes:
  pgdata: