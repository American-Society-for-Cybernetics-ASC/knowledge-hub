services:
  server:
    build: backend
    command: ["uv", "run", "fastapi", "dev", "main.py", "--host", "0.0.0.0", "--port", "80"]
    env_file:
      - backend/.env     
    environment:
      DATABASE_URL: postgresql+psycopg2://username:password@db:5432/database
    ports:
      - 8000:80
    links: # Allows the server to reach the database at host:port=db:5432
      - db
    networks:
      - public
      - isolated
  db:
    image: postgres:latest
    shm_size: 128mb
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - isolated
  frontend:
    build: frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - 3000:3000
    networks:
      - public
    depends_on:
      - server
networks:
  isolated:
    internal: true
  public:
volumes:
  pgdata: