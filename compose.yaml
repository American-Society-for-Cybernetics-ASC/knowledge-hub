services:
  server:
    build: backend
    command: ["uv", "run", "--package", "server", "fastapi", "dev", "server/main.py", "--host", "0.0.0.0", "--port", "80"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-1024}
      CLAUDE_SYSTEM_PROMPT_PATH: ${CLAUDE_SYSTEM_PROMPT_PATH:-server/claude_interface/prompts/synthesis_system.txt}
    ports:
      - 8000:80
    links: # Allows the server to reach the database at host:port=db:5432
      - db
    networks:
      - public
      - isolated
  auth_server:
    build: backend
    command: ["uv", "run", "--package", "auth_server", "fastapi", "dev", "auth_server/main.py", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - 8001:80
    links: # Allows the server to reach the database at host:port=db:5432
      - db
    networks:
      - public
      - isolated
  db:
    image: postgres:latest
    shm_size: 128mb
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - isolated
  frontend:
    build: frontend
    ports:
      - 3000:3000
    networks:
      - public
    depends_on:
      - server
networks:
  isolated:
    internal: true
  public:
volumes:
  pgdata: